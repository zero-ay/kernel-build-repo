name: 'Build Kernel'
description: 'Runs build.sh with the given config/LTO setting and locates the dist output'

inputs:
  build_config:
    description: 'BUILD_CONFIG path passed to build.sh'
    required: true
  lto:
    description: 'LTO mode: thin | full | none'
    required: false
    default: 'thin'

outputs:
  dist_dir:
    description: 'Path to the resulting dist/ directory'
    value: ${{ steps.dist.outputs.dist_dir }}

runs:
  using: 'composite'
  steps:
    # Strip the '-dirty' suffix from the kernel release string: the build
    # tree has uncommitted changes (KernelSU-Next), so setlocalversion would
    # otherwise append '-dirty' (e.g. 5.10.223-android12-9-gXXXX-dirty).
    - name: Remove -dirty from kernel release string
      shell: bash
      run: |
        sed -i "s/printf '%s' -dirty/printf '%s' ''/g" common/scripts/setlocalversion

    # KernelSU changes kernel internals, so GKI KMI/ABI compliance no longer
    # holds: disable the strict KMI symbol comparison (otherwise the build
    # fails on e.g. __stack_chk_guard missing from ksymtab with newer clang).
    - name: Run build.sh
      shell: bash
      run: KMI_SYMBOL_LIST_STRICT_MODE=0 LTO=${{ inputs.lto }} BUILD_CONFIG="${{ inputs.build_config }}" build/build.sh

    - name: Locate build output
      id: dist
      shell: bash
      run: |
        DIST_DIR=$(find . -maxdepth 4 -type d -name dist 2>/dev/null | head -n1)
        echo "dist_dir=${DIST_DIR}" >> "$GITHUB_OUTPUT"
        ls -la "${DIST_DIR}" || true

name: 'Build Kernel'
description: 'Runs the fixed GKI build command (LTO=thin, common/build.config.gki.aarch64) and locates the dist output'

outputs:
  dist_dir:
    description: 'Path to the resulting dist/ directory'
    value: ${{ steps.dist.outputs.dist_dir }}

runs:
  using: 'composite'
  steps:
    # Strip the '-dirty' suffix from the kernel release string: the build
    # tree has uncommitted changes (KernelSU-Next), so setlocalversion would
    # otherwise append '-dirty' (e.g. 5.10.223-android12-9-gXXXX-dirty).
    - name: Remove -dirty from kernel release string
      shell: bash
      run: |
        sed -i "s/printf '%s' -dirty/printf '%s' ''/g" common/scripts/setlocalversion

    # GKI KMI/ABI check stays enabled: build.config.gki.aarch64 defaults
    # KMI_SYMBOL_LIST_STRICT_MODE to 1 (1-1 match of the KMI symbol list against
    # the built vmlinux). The toolchain comes from the official AOSP shallow
    # clang clone (setup-toolchain auto-links the newest clang-r* folder).
    - name: Run build.sh
      shell: bash
      run: LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

    - name: Locate build output
      id: dist
      shell: bash
      run: |
        DIST_DIR=$(find . -maxdepth 4 -type d -name dist 2>/dev/null | head -n1)
        echo "dist_dir=${DIST_DIR}" >> "$GITHUB_OUTPUT"
        ls -la "${DIST_DIR}" || true

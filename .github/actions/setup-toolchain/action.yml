name: 'Setup Toolchain'
description: >
  Mirrors the official kernel/manifest (common-android12-5.10): all build
  infrastructure projects inherit <default revision="master-kernel-build-2021">
  and the prebuilts are shallow (clone-depth="1"). Clones use --depth=1 at the
  manifest's exact paths/branches so build.sh finds build/ and the prebuilts it
  expects.

runs:
  using: 'composite'
  steps:
    # Official AOSP prebuilt clang, at the manifest path/revision.
    # master-kernel-build-2021 carries clang-r416183b, which
    # common/build.config.common pins (CLANG_PREBUILT_BIN=.../clang-r416183b/bin)
    - name: Clone AOSP prebuilt clang (manifest revision, shallow)
      shell: bash
      run: |
        git clone --depth=1 -b master-kernel-build-2021 \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
          prebuilts-master/clang/host/linux-x86

    # Generic AOSP host tools (nproc, awk, bc, etc.) — referenced by
    # build/build-tools/path/linux-x86/* symlinks inside the kernel/build repo
    - name: Clone platform/prebuilts/build-tools
      shell: bash
      run: |
        git clone --depth=1 -b master-kernel-build-2021 \
          https://android.googlesource.com/platform/prebuilts/build-tools \
          prebuilts/build-tools

    # Kernel-specific host tools (pahole, etc.)
    - name: Clone kernel/prebuilts/build-tools
      shell: bash
      run: |
        git clone --depth=1 -b master-kernel-build-2021 \
          https://android.googlesource.com/kernel/prebuilts/build-tools \
          prebuilts/kernel-build-tools

    # mkbootimg — needed to assemble boot.img
    - name: Clone mkbootimg
      shell: bash
      run: |
        git clone --depth=1 -b master-kernel-build-2021 \
          https://android.googlesource.com/platform/system/tools/mkbootimg \
          tools/mkbootimg

    # Hermetic host sysroot (glibc headers/libs for host tools). Required by
    # HERMETIC_TOOLCHAIN=1: build/build-tools/sysroot is a symlink to
    # prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/sysroot
    - name: Clone gcc host prebuilt (hermetic sysroot)
      shell: bash
      run: |
        git clone --depth=1 -b master-kernel-build-2021 \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 \
          prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

    # build.config.common pins CLANG_PREBUILT_BIN to a clang-r* folder. Fail
    # fast here with a clear message if the shallow clone is missing it —
    # otherwise build.sh dies later with "build/build.sh: No such file or
    # directory"-style cryptic errors.
    - name: Verify clang folder pinned by build.config.common exists
      shell: bash
      run: |
        CLANG_ROOT="prebuilts-master/clang/host/linux-x86"
        EXPECTED=$(sed -n 's#^CLANG_PREBUILT_BIN=.*/\(clang-r[^/]*\)/bin$#\1#p' common/build.config.common | head -n1)
        : "${EXPECTED:=clang-r416183b}"
        test -x "${CLANG_ROOT}/${EXPECTED}/bin/clang" || {
          echo "::error::build.config.common expects ${EXPECTED} but the clang clone has: $(ls "${CLANG_ROOT}" 2>/dev/null | tr '\n' ' ')"
          exit 1
        }
        echo "Toolchain OK: ${CLANG_ROOT}/${EXPECTED}/bin/clang"

    - name: Make prebuilt binaries executable
      shell: bash
      run: |
        chmod +x prebuilts-master/clang/host/linux-x86/clang-r*/bin/* 2>/dev/null || true
        find prebuilts/build-tools prebuilts/kernel-build-tools prebuilts/gcc tools/mkbootimg -type f -exec chmod +x {} \; 2>/dev/null || true

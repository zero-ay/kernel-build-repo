name: 'Setup Toolchain'
description: 'Clones the official Google AOSP prebuilts (shallow, --depth=1, default branches) at the paths build.sh expects'

runs:
  using: 'composite'
  steps:
    # Official Google AOSP Prebuilt Clang, deep history excluded (--depth=1).
    - name: Clone official AOSP prebuilt clang (shallow)
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
          prebuilts-clang

    # Generic AOSP host tools (nproc, awk, bc, etc.) — referenced by
    # build/build-tools/path/linux-x86/* symlinks inside the kernel/build repo
    - name: Clone platform/prebuilts/build-tools
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/build-tools \
          prebuilts/build-tools

    # Kernel-specific host tools (pahole, etc.)
    - name: Clone kernel/prebuilts/build-tools
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/prebuilts/build-tools \
          prebuilts/kernel-build-tools

    # mkbootimg — needed to assemble boot.img
    - name: Clone mkbootimg
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg \
          tools/mkbootimg

    # Hermetic host sysroot (glibc headers/libs for host tools). Required by
    # HERMETIC_TOOLCHAIN=1: build/build-tools/sysroot is a symlink to
    # prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/sysroot
    - name: Clone gcc host prebuilt (hermetic sysroot)
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 \
          prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8

    # kernel/build's build.config.common pins CLANG_PREBUILT_BIN to a specific
    # clang folder (e.g. clang-r416183b). The shallow clone carries the newest
    # clang-r* folder(s) of its default branch, so link the config-expected name
    # to the newest available folder in the clone.
    - name: Link config-expected clang path to the shallow clone
      shell: bash
      run: |
        CLANG_ROOT="prebuilts-master/clang/host/linux-x86"
        CLANG_VERSION=$(ls -d prebuilts-clang/clang-r* 2>/dev/null | sed 's#.*/##' | sort -V | tail -n1)
        test -n "${CLANG_VERSION}" || {
          echo "::error::no clang-r* folder found in prebuilts-clang"
          exit 1
        }
        EXPECTED=$(sed -n 's#^CLANG_PREBUILT_BIN=.*/\(clang-r[^/]*\)/bin$#\1#p' common/build.config.common | head -n1)
        : "${EXPECTED:=clang-r416183b}"
        mkdir -p "${CLANG_ROOT}"
        ln -sfn "${GITHUB_WORKSPACE}/prebuilts-clang/${CLANG_VERSION}" "${CLANG_ROOT}/${EXPECTED}"
        echo "Linked ${CLANG_ROOT}/${EXPECTED} -> prebuilts-clang/${CLANG_VERSION} (newest in shallow clone)"
        test -x "${CLANG_ROOT}/${EXPECTED}/bin/clang" || \
          echo "::warning::clang binary not found at ${CLANG_ROOT}/${EXPECTED}/bin/clang"

    - name: Make prebuilt binaries executable
      shell: bash
      run: |
        chmod +x prebuilts-clang/clang-r*/bin/* 2>/dev/null || true
        find prebuilts/build-tools prebuilts/kernel-build-tools prebuilts/gcc tools/mkbootimg -type f -exec chmod +x {} \; 2>/dev/null || true

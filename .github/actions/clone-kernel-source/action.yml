name: 'Clone Kernel Source'
description: 'Clones kernel/common (version-specific) and kernel/build (universal build scripts)'

inputs:
  kernel_branch:
    description: 'Branch/tag of kernel/common to clone (e.g. android12-5.10)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Clone kernel/common
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/common \
          -b "${{ inputs.kernel_branch }}" common

    # Main build script — official Google kernel/build, deep history excluded.
    - name: Clone kernel/build
      shell: bash
      run: |
        git clone --depth=1 https://android.googlesource.com/kernel/build build

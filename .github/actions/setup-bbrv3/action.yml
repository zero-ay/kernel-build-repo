name: 'Setup TCP BBRv3'
description: >
  Applies the TCP BBR v3 port (patches/bbrv3/) to the common kernel source.
  The patch backports Google's TCP BBR v3 (github.com/google/bbr, branch v3)
  from upstream Linux 6.13.7 onto android12-5.10, and enables it in the GKI
  defconfig (CONFIG_TCP_CONG_ADVANCED + CONFIG_TCP_CONG_BBR) without touching
  net.ipv4.tcp_congestion_control (the default CC stays CUBIC; BBRv3 is
  selectable via sysctl).

runs:
  using: 'composite'
  steps:
    - name: Apply BBRv3 patch in common/
      shell: bash
      working-directory: common
      run: |
        set -e
        patch -p1 -F2 < "${{ github.workspace }}/patches/bbrv3/50_add_bbrv3_in_gki-android12-5.10.patch"

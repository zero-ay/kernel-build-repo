name: Build Android Kernel (android12-5.10)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'kernel/common branch/tag to build'
        required: false
        default: 'android12-5.10'
      manifest_branch:
        description: >
          Manifest default revision for kernel_branch — shared by kernel/build,
          prebuilt build-tools, mkbootimg, and the gcc hermetic sysroot.
          Clang comes separately from clang_ref. Check the kernel_branch's
          manifest default.xml <default revision="..."> if you change kernel_branch.
        required: false
        default: 'master-kernel-build-2021'
      build_config:
        description: 'Build config file to use (relative to workspace root)'
        required: false
        default: 'common/build.config.gki.aarch64'
      lto:
        description: 'LTO mode: thin | full | none'
        required: false
        default: 'thin'
      clang_version:
        description: 'Clang prebuilt version (folder name under prebuilts-master/clang/host/linux-x86)'
        required: false
        default: 'clang-r547379'
      clang_ref:
        description: 'Branch/ref on platform/prebuilts/clang/host/linux-x86 that contains clang_version'
        required: false
        default: 'main'
      ksu_ref:
        description: 'KernelSU-Next tag/commit to check out (leave empty for latest tag)'
        required: false
        default: ''
  push:
    branches: [ main ]
  schedule:
    # Rebuild weekly, Monday 00:00 UTC — remove if you don't want auto rebuilds
    - cron: '0 0 * * 1'

env:
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android12-5.10' }}
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'master-kernel-build-2021' }}
  BUILD_CONFIG: ${{ github.event.inputs.build_config || 'common/build.config.gki.aarch64' }}
  LTO: ${{ github.event.inputs.lto || 'thin' }}
  CLANG_VERSION: ${{ github.event.inputs.clang_version || 'clang-r547379' }}
  CLANG_REF: ${{ github.event.inputs.clang_ref || 'main' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref || '' }}

jobs:
  build:
    # 22.04 is the best-tested host for the 2021-era prebuilt toolchain
    # (clang-r416183b, gcc-4.8 hermetic sysroot prebuilts).
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # Needed so the runner has access to the composite actions in .github/actions/
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: ./.github/actions/install-deps

      - name: Clone kernel source
        uses: ./.github/actions/clone-kernel-source
        with:
          kernel_branch: ${{ env.KERNEL_BRANCH }}
          build_branch: ${{ env.MANIFEST_BRANCH }}

      - name: Setup KernelSU-Next
        uses: ./.github/actions/setup-kernelsu
        with:
          ksu_ref: ${{ env.KSU_REF }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          clang_version: ${{ env.CLANG_VERSION }}
          clang_ref: ${{ env.CLANG_REF }}
          toolchain_branch: ${{ env.MANIFEST_BRANCH }}

      - name: Build kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          build_config: ${{ env.BUILD_CONFIG }}
          lto: ${{ env.LTO }}

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_BRANCH }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.dist_dir }}/Image*
          if-no-files-found: warn
          retention-days: 14

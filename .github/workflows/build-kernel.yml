name: Build Android Kernel (android12-5.10)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'kernel/common branch/tag to build'
        required: false
        default: 'android12-5.10'
      ksu_ref:
        description: 'KernelSU-Next tag/commit to check out (must be the version the SUSFS patch was adapted for — see patches/susfs/)'
        required: false
        default: 'v3.3.0'

env:
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android12-5.10' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref || 'v3.3.0' }}

jobs:
  build:
    # 22.04 is the best-tested host for the prebuilt toolchain
    # (gcc-4.8 hermetic sysroot prebuilts).
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # Needed so the runner has access to the composite actions in .github/actions/
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        uses: ./.github/actions/install-deps

      - name: Clone kernel source
        uses: ./.github/actions/clone-kernel-source
        with:
          kernel_branch: ${{ env.KERNEL_BRANCH }}

      - name: Setup KernelSU-Next
        uses: ./.github/actions/setup-kernelsu
        with:
          ksu_ref: ${{ env.KSU_REF }}

      - name: Setup SUSFS (patches for KernelSU-Next)
        uses: ./.github/actions/setup-susfs
        with:
          ksu_ref: ${{ env.KSU_REF }}

      - name: Setup TCP BBR v3
        uses: ./.github/actions/setup-bbrv3
        with:
          kernel_branch: ${{ env.KERNEL_BRANCH }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build kernel
        id: build
        uses: ./.github/actions/build-kernel

      # Drop the built kernel into the AnyKernel3 flashable template
      # (kernel-zipping/). Upload the package *contents* (not a nested zip):
      # upload-artifact wraps the path in a zip, so uploading package/*
      # makes the downloaded artifact the flashable zip itself.
      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -e
          DIST="${{ steps.build.outputs.dist_dir }}"
          if [ -f "${DIST}/Image" ]; then
            IMG="${DIST}/Image"
          elif [ -f "${DIST}/Image.lz4" ]; then
            IMG="${DIST}/Image.lz4"
          else
            echo "ERROR: no Image found in ${DIST}" >&2
            exit 1
          fi
          rm -rf package
          cp -r kernel-zipping package
          cp "${IMG}" "package/$(basename "${IMG}")"
          ls -la package

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_BRANCH }}-${{ github.run_number }}
          path: package/*
          if-no-files-found: error
          retention-days: 14
